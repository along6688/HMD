name: Build WiFi-Blacklist APK (25.12 aarch64)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TERM: xterm
    steps:
      - name: 安装解压工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: 下载 OpenWrt 25.12.6 SDK (mediatek-filogic)
        run: |
          cd $HOME
          curl -fL --retry 3 -o sdk.tar.zst https://downloads.openwrt.org/releases/25.12.6/targets/mediatek/filogic/openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          tar -I zstd -xf sdk.tar.zst
          ls -d $HOME/openwrt-sdk-*

      - name: 解出插件源码
        run: |
          SDK=$(ls -d $HOME/openwrt-sdk-* | head -1)
          MK=$SDK/package/luci-app-wifi-blacklist
          mkdir -p $MK
          echo "" | base64 -d > /tmp/pkg.tgz
          tar xzf /tmp/pkg.tgz -C $MK
          find $MK -type f
          grep -n "DEPENDS" $MK/Makefile

      - name: 生成默认配置
        run: |
          SDK=$(ls -d $HOME/openwrt-sdk-* | head -1)
          cd $SDK
          make defconfig -j1 V=s

      - name: 编译 apk 包
        run: |
          SDK=$(ls -d $HOME/openwrt-sdk-* | head -1)
          cd $SDK
          make package/luci-app-wifi-blacklist/compile -j1 V=s

      - name: 收集 .apk
        run: |
          SDK=$(ls -d $HOME/openwrt-sdk-* | head -1)
          mkdir -p $HOME/out
          find $SDK/bin/packages -name "*wifi-blacklist*" -exec cp {} $HOME/out/ \;
          ls -l $HOME/out

      - name: 上传 apk
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-wifi-blacklist-apk
          path: $HOME/out/*
          retention-days: 30
